
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>운전결심 다운로드</title>

  <!-- GA4 Google tag (gtag.js) -->
  <script/www.googletagmanager.com/gtag/js?id=G-7T3TMF2P41</script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7T3TMF2P41', { send_page_view: true });
  </script>

  <script>
    function detectOS() {
      const ua = (navigator.userAgent || "").toLowerCase();
      if (ua.includes("android")) return "android";
      const isIOSUA = /iphone|ipad|ipod/.test(ua);
      const isIPadOS = ua.includes("macintosh") && navigator.maxTouchPoints && navigator.maxTouchPoints > 1;
      return (isIOSUA || isIPadOS) ? "ios" : "other";
    }

    function redirectNow(url) { window.location.replace(url); }

    document.addEventListener("DOMContentLoaded", function () {
      const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.iwilldrive.android";
      const IOS_URL = "https://apps.apple.com/kr/app/%EC%9A%B4%EC%A0%84%EA%B2%B0%EC%8B%AC/id1532367997";
      const WEB_URL = "https://www.yesidrive.com/";

      const os = detectOS();
      if (os === "android") redirectNow(ANDROID_URL);
      else if (os === "ios") redirectNow(IOS_URL);
      else redirectNow(WEB_URL);
    });
  </script>
</head>
<body>
  <p>연결 중입니다…</p>
</body>
</html>
